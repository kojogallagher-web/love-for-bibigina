<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ถึงบิบี๋จีน่า 🐰🤍</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:linear-gradient(180deg,#ffd6e7,#fff5f8);
    overflow-x:hidden;
    text-align:center;
    color:#444;
}

.container{
    max-width:700px;
    margin:30px auto;
    padding:20px;
}

h1{
    color:#ff4f88;
    margin-bottom:20px;
}

.slider{
    width:100%;
    max-width:420px;
    margin:auto;
    overflow:hidden;
    border-radius:20px;
    box-shadow:0 10px 25px rgba(0,0,0,.2);
}

.slider img{
    width:100%;
    display:block;
    transition:opacity .8s;
}

.message{
    margin-top:25px;
    background:#fff;
    padding:25px;
    border-radius:20px;
    line-height:1.9;
    box-shadow:0 10px 20px rgba(0,0,0,.1);
}

.heart{
    position:fixed;
    bottom:-40px;
    font-size:24px;
    animation:float linear infinite;
}

@keyframes float{
0%{
transform:translateY(0);
opacity:1;
}
100%{
transform:translateY(-120vh);
opacity:0;
}
}
</style>
</head>

<body>

<div class="container">

<div class="slider">
<img id="slide" src="image-29.png">
</div>

  <script>
let images = [
    let images = [
    "image-29.png",
    "image-37.png",
    "image-41.png",
    "image-44.png",
    "image-45.png",
    "image-46.png",
    "image-47.png",
    "image-51.png"
];
    
    
];

let index = 0;

setInterval(()=>{
    index++;
    if(index >= images.length){
        index = 0;
    }

    document.getElementById("slide").src = images[index];

},3000);
</script>

</div>

</body>
</html>
